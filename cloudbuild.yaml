# Build & deploy to Cloud Run via Google Cloud Build.
# Usage:
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=_GEMINI_API_KEY=YOUR_KEY_HERE
#
# For production, store the key in Secret Manager and reference it instead of
# passing it on the command line.
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/scriba:latest', '.']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/scriba:latest']
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'scriba'
      - '--image=gcr.io/$PROJECT_ID/scriba:latest'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--set-env-vars=GEMINI_MODEL=gemini-3.5-flash'
      - '--set-secrets=GEMINI_API_KEY=gemini-api-key:latest'
substitutions:
  _GEMINI_API_KEY: ''
